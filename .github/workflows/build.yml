name: Build MyCRM Driver

# push to main     → unit tests + debug APK (compile check, artifact)
# push of tag v*   → unit tests + signed release APK → GitHub Release (mycrm-driver.apk + mycrm-driver-vX.Y.Z.apk)
# manual           → same as push to main
# Every run also writes a short log to the ci-logs branch (readable with plain git).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    defaults:
      run:
        shell: bash   # explicit bash = -eo pipefail, so "gradlew | tee" fails the step on a build error
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: ver
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            TAG=""
            VER="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          CORE="${VER%%-*}"
          IFS='.' read -r MA MI PA <<< "$CORE"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          [ "$CODE" -lt 1 ] && CODE=1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "version $VER (code $CODE)"

      - name: Signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 is missing (Settings → Secrets and variables → Actions)"
            echo "SIGNING: secret KEYSTORE_B64 missing" > ci-summary.txt
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mycrm-driver.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/mycrm-driver.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build debug APK
        if: env.IS_RELEASE != 'true'
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in *unsigned*) echo "::error::APK is unsigned — check KEYSTORE_PASSWORD"; exit 1;; esac
          mkdir -p dist
          cp "$APK" dist/mycrm-driver.apk
          cp "$APK" "dist/mycrm-driver-v${{ steps.ver.outputs.version }}.apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs dist/mycrm-driver.apk | tee signer.txt
          ls -la dist

      - name: Upload debug APK (artifact)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mycrm-driver-debug-${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="notes/${TAG}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" release-notes.md; else echo "MyCRM Driver ${TAG}" > release-notes.md; fi
          gh release create "$TAG" dist/mycrm-driver.apk "dist/mycrm-driver-${TAG}.apk" \
            --title "MyCRM Driver ${TAG}" --notes-file release-notes.md --latest

      - name: Write log to ci-logs branch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          RUN="${GITHUB_RUN_NUMBER}"
          REF="${GITHUB_REF_NAME//\//-}"
          F="run-$(printf '%05d' "$RUN")-${REF}.log"
          {
            echo "run: $RUN  ref: $GITHUB_REF_NAME  sha: $GITHUB_SHA"
            echo "status: $JOB_STATUS"
            echo "version: ${{ steps.ver.outputs.version }} code ${{ steps.ver.outputs.code }}"
            echo "time: $(date -u +%FT%TZ)"
            [ -f ci-summary.txt ] && cat ci-summary.txt
            echo; echo "===== errors ====="
            cat test.log build.log 2>/dev/null | grep -E "^e: |error:|FAILED|BUILD FAILED|What went wrong|Exception|> Task .* FAILED" | head -200
            echo; echo "===== unit tests (tail) ====="; tail -n 80 test.log 2>/dev/null
            echo; echo "===== build (tail) ====="; tail -n 250 build.log 2>/dev/null
            echo; echo "===== signer ====="; cat signer.txt 2>/dev/null
            echo; echo "===== test reports ====="
            for x in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$x" ] && grep -E "<testsuite |<failure" "$x" | head -20; done
          } > "$RUNNER_TEMP/$F"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/logs"
            if git fetch --depth 1 origin ci-logs 2>/dev/null; then
              git worktree add -f "$RUNNER_TEMP/logs" FETCH_HEAD >/dev/null 2>&1
              cd "$RUNNER_TEMP/logs"; git checkout -B ci-logs >/dev/null 2>&1
            else
              git worktree add -f --detach "$RUNNER_TEMP/logs" >/dev/null 2>&1
              cd "$RUNNER_TEMP/logs"; git checkout --orphan ci-logs >/dev/null 2>&1; git rm -rfq . >/dev/null 2>&1
            fi
            cp "$RUNNER_TEMP/$F" .
            ls run-*.log 2>/dev/null | sort | head -n -15 | xargs -r git rm -q
            git add -A
            git commit -qm "log $F ($JOB_STATUS)" || true
            if git push -q origin HEAD:ci-logs; then cd "$GITHUB_WORKSPACE"; break; fi
            cd "$GITHUB_WORKSPACE"; git worktree remove -f "$RUNNER_TEMP/logs" 2>/dev/null; sleep 3
          done
          exit 0
